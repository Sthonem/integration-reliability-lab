[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-reliability-lab"
version = "1.0.0"
description = "Mock POS, payments and loyalty integrations with signed webhooks, idempotency, retries, outbox, DLQ and reconciliation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.0.1",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "fakeredis>=2.26"]
# Optional Claude-backed triage (TRIAGE_PROVIDER=anthropic). Not needed for tests or the demo.
ai = ["anthropic>=2.6"]

[tool.setuptools.packages.find]
include = ["irlab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
